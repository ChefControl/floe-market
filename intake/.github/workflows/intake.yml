# Turns Floe Market's in-game reports into issues here. Every 30 minutes it reads new reports from Firestore, puts
# each one's picture and save on the `files` branch, opens an issue, and clears out pictures and saves once they've
# been kept as long as the player was told (30 days; 7 for older reports). Setup: README.md.
name: Reports to issues

on:
  schedule:
    # every 30 minutes, off the hour (GitHub's busiest minute); scheduled runs can start a few minutes late
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write   # the files branch
  issues: write     # the issues
  id-token: write   # signing in to Google Cloud without a stored key

concurrency:
  group: intake
  cancel-in-progress: false

jobs:
  intake:
    # skipped (and not billed) until the Google Cloud setup in README.md is done
    if: vars.WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - run: npm start
        env:
          FIREBASE_PROJECT: ${{ vars.FIREBASE_PROJECT }}
          GITHUB_TOKEN: ${{ github.token }}
