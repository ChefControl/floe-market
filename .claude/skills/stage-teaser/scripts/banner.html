<!doctype html><meta charset="utf-8">
<!-- The stage banner at the end of a teaser: the game's font, a warm dark ground, the game's name and stage number small,
     the stage's name big, "Coming soon" last. Drawn for any time t by window.at(t), so banner.mjs can render it frame by
     frame. Text comes from the query string: ?icon=🐡&kicker=FLOE MARKET · STAGE 3&title=THE DOHYO|BELOW&sub=Coming soon
     (a | breaks the title's line). &theme=ice gives it a cold blue ground (stage 1's winter market) in place of the warm
     dark one. -->
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #000; }
  /* (sizes in vmin: the same card on a 720×1280 portrait page and a 1920×1080 landscape one) */
  #ground { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, #3A2010 0%, #1C0E06 60%, #0B0502 100%); }
  #ground::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, #0000 0 88px, #0000002e 88px 92px); }
  #card { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 2.5vmin; font-family: "Baloo 2", sans-serif; font-weight: 800; }
  .icon { font-size: 12.5vmin; line-height: 1; }
  .kicker { color: #F2C14E; font-size: 4.2vmin; letter-spacing: .56vmin; }
  .title { color: #FFF1D2; font-size: 14.4vmin; line-height: 0.95; -webkit-text-stroke: 1.95vmin #1A0A03; paint-order: stroke fill; }
  .sub { color: #FFF1D2; font-size: 6.1vmin; }
  .ice #ground { background: radial-gradient(ellipse at 50% 45%, #2A5F80 0%, #133349 60%, #07141E 100%); }
  .ice .kicker { color: #9FE0FF; }
  .ice .title { color: #F4FBFF; -webkit-text-stroke-color: #0A1C2A; }
  .ice .sub { color: #F4FBFF; }
</style>
<div id="ground"></div>
<div id="card"><div class="icon"></div><div class="kicker"></div><div class="title"></div><div class="sub"></div></div>
<script>
  const q = new URLSearchParams(location.search), $ = s => document.querySelector(s);
  $('.icon').textContent = q.get('icon') ?? '🐡';
  $('.kicker').textContent = q.get('kicker') ?? 'FLOE MARKET · STAGE 3';
  $('.title').innerHTML = (q.get('title') ?? 'THE DOHYO|BELOW').split('|').map(s => s.replace(/[<&]/g, c => ({ '<': '&lt;', '&': '&amp;' })[c])).join('<br>');
  $('.sub').textContent = q.get('sub') ?? 'Coming soon';
  if (q.get('theme')) document.body.classList.add(q.get('theme'));
  const ease = k => 1 - Math.pow(1 - Math.min(1, Math.max(0, k)), 3);
  /** The banner at t seconds: the ground fades up, the card follows, the title settles, "Coming soon" comes last. */
  window.at = t => {
    $('#ground').style.opacity = ease(t / 0.5);
    $('#card').style.opacity = ease((t - 0.05) / 0.6);
    $('.title').style.transform = `scale(${1.08 - 0.08 * ease((t - 0.25) / 0.8)})`;
    $('.sub').style.opacity = ease((t - 1.25) / 0.5);
  };
  window.at(0);
</script>
