name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The unit tests, in four shards side by side, each on a runner of its own: most of them load the whole game, some
  # hundreds of times, which on one runner took over ten minutes. The shards split the files by how long each takes
  # (test/shards.ts). Each shard keeps its results and coverage in a blob for build to merge.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # (Vitest's own count of workers, three on the runner's four cores: a fourth made a slow runner slower still, and
      # tests that load the game twice ran past their 15 s)
      - run: npx vitest run --coverage --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=default --reporter=blob
        env:
          VITEST_SHARD: ${{ matrix.shard }}
      - uses: actions/upload-artifact@v7
        with:
          name: blob-${{ matrix.shard }}
          path: .vitest/blob/
          include-hidden-files: true
          retention-days: 1

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: blob-*
          path: .vitest/blob/
          merge-multiple: true
      # Unit tests gate the deploy: a failing test (in any shard) or coverage below the thresholds (over all of them,
      # merged) stops here. It also writes how long each file took, for the shards' split (test/shards.ts).
      - run: npx vitest run --merge-reports=.vitest/blob --coverage --reporter=default --reporter=./test/shards.ts
      - uses: actions/upload-artifact@v7
        with:
          name: test-times
          path: .vitest/times.json
          include-hidden-files: true
          retention-days: 30
      # Stage 3 is open to players (src/flags.ts). To take it back, set 'off' and push: saves that have met Mr. Fugu
      # keep it on. The web game has Buy me a coffee (Ko-fi, src/flags.ts); it's off in any build that doesn't say so,
      # the Steam build's included. The build also lists the open-source licences of what it bundled, and stops on a GPL,
      # LGPL or AGPL one, or one it can't read, that the owner hasn't approved (tools/licences.ts).
      - run: npm run build
        env:
          VITE_STAGE3: 'on'
          VITE_KOFI: 'on'
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # firestore.rules against the Firestore emulator (test/rules/), which needs Java. Rules are pasted into the Firebase
  # console by hand, so this doesn't gate the deploy, but a pull request that breaks them shows red.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:rules

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
