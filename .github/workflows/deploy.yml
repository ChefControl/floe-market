name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The unit tests, in four shards side by side, each on a runner of its own: most of them load the whole game, some
  # hundreds of times, which on one runner took over ten minutes. The shards split the files by how long each takes
  # (test/shards.ts). Each shard keeps its results and coverage in a blob for build to merge.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # (Vitest's own count of workers, three on the runner's four cores: a fourth made a slow runner slower still, and
      # tests that load the game twice ran past their 15 s)
      - run: npx vitest run --coverage --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=default --reporter=blob
        env:
          VITEST_SHARD: ${{ matrix.shard }}
      - uses: actions/upload-artifact@v7
        with:
          name: blob-${{ matrix.shard }}
          path: .vitest/blob/
          include-hidden-files: true
          retention-days: 1

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: blob-*
          path: .vitest/blob/
          merge-multiple: true
      # Unit tests gate the deploy: a failing test (in any shard) or coverage below the thresholds (over all of them,
      # merged) stops here. It also writes how long each file took, for the shards' split (test/shards.ts).
      - run: npx vitest run --merge-reports=.vitest/blob --coverage --reporter=default --reporter=./test/shards.ts
      - uses: actions/upload-artifact@v7
        with:
          name: test-times
          path: .vitest/times.json
          include-hidden-files: true
          retention-days: 30
      # Stage 3 is open to players (src/flags.ts). To take it back, set 'off' and push: saves that have met Mr. Fugu
      # keep it on. The web game has Buy me a coffee (Ko-fi, src/flags.ts); it's off in any build that doesn't say so,
      # the Steam build's included. The build also lists the open-source licences of what it bundled, and stops on a GPL,
      # LGPL or AGPL one, or one it can't read, that the owner hasn't approved (scripts/licences.ts).
      - run: npm run build
        env:
          VITE_STAGE3: 'on'
          VITE_KOFI: 'on'
      # The browser game closed in November 2026 (it goes to Steam instead), so the build above only proves the game
      # still builds. GitHub Pages serves just the coming-to-Steam page (site/) and the privacy notice the store page
      # links to.
      - run: |
          mkdir -p _site/fonts
          cp site/index.html site/art.jpg public/privacy.html public/favicon.svg public/apple-touch-icon.png _site/
          cp public/fonts/baloo2-800.woff2 public/fonts/OFL-Baloo2.txt _site/fonts/
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # The desktop app for Steam (desktop/, #166): Windows and Linux (the Steam Deck runs the Linux one) from the same
  # commit, on every pull request and merge, as artifacts to try. Each is built on its own system, so Windows gets its
  # program's details (rcedit) and Linux keeps its files' run permissions (packed in a tarball, as an artifact zip would
  # drop them). A test build only warns about a licence still waiting for approval (FFmpeg's, until Valve agrees:
  # desktop/notices.mjs); once uploads are on (the STEAM_UPLOAD variable), main's builds are release builds, which stop
  # on it instead.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win32, name: windows, demo: '' }
          - { os: ubuntu-latest, platform: linux, name: linux, demo: '' }
          # the Steam demo (#183), an app of its own
          - { os: windows-latest, platform: win32, name: demo-windows, demo: --demo }
          - { os: ubuntu-latest, platform: linux, name: demo-linux, demo: --demo }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      # (Electron's own program, for its licence notices; npm may skip its install script)
      - run: node node_modules/electron/install.js
        working-directory: desktop
      # (a release build of the demo takes the full game's id for its Wishlist button: only then, from a secret)
      - run: node build.mjs --platform=${{ matrix.platform }} ${{ matrix.demo }} $RELEASE
        shell: bash
        working-directory: desktop
        env:
          RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STEAM_UPLOAD == 'on' && '--release' || '' }}
          STEAM_APP_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STEAM_UPLOAD == 'on' && secrets.STEAM_APP_ID || '' }}
      - run: mv desktop/out/Floe\ Market*-${{ matrix.platform }}-x64 desktop/out/app
        shell: bash
      - if: matrix.platform == 'linux'
        run: tar -czf floe-market-${{ matrix.name }}.tar.gz -C desktop/out/app .
      - uses: actions/upload-artifact@v7
        with:
          name: floe-market-${{ matrix.name }}
          path: ${{ matrix.platform == 'linux' && format('floe-market-{0}.tar.gz', matrix.name) || 'desktop/out/app' }}
          retention-days: 14

  # Each merge to main goes up to Steam, both depots onto the app's beta branch; the owner sets builds live in
  # Steamworks. Only once the tests have passed (build) and the owner has turned uploads on (the STEAM_UPLOAD variable,
  # after the build-upload account, #143: docs/steam-upload.md). The ids and the account are secrets of the "steam"
  # environment, never in the repo.
  steam:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STEAM_UPLOAD == 'on'
    needs: [build, desktop]
    runs-on: ubuntu-latest
    environment: steam
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: floe-market-*
          path: artifacts
      - run: |
          for app in game demo; do
            from=floe-market-; [ $app = demo ] && from=floe-market-demo-
            mkdir -p steam/$app/linux
            mv artifacts/${from}windows steam/$app/windows
            tar -xzf artifacts/${from}linux/${from}linux.tar.gz -C steam/$app/linux
          done
      - run: |
          node desktop/steam/upload.mjs steam/game steam/build-game
          node desktop/steam/upload.mjs steam/demo steam/build-demo --demo
        env:
          STEAM_APP_ID: ${{ secrets.STEAM_APP_ID }}
          STEAM_DEPOT_WINDOWS: ${{ secrets.STEAM_DEPOT_WINDOWS }}
          STEAM_DEPOT_LINUX: ${{ secrets.STEAM_DEPOT_LINUX }}
          STEAM_DEMO_APP_ID: ${{ secrets.STEAM_DEMO_APP_ID }}
          STEAM_DEMO_DEPOT_WINDOWS: ${{ secrets.STEAM_DEMO_DEPOT_WINDOWS }}
          STEAM_DEMO_DEPOT_LINUX: ${{ secrets.STEAM_DEMO_DEPOT_LINUX }}
      # Valve's uploader, from Valve, and the build-upload account's saved login (Steam Guard), so it needs no password
      # or code here
      - run: |
          mkdir -p ~/steamcmd && cd ~/steamcmd
          curl -fsSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar -xz
          mkdir -p config ~/Steam/config
          echo "$STEAM_CONFIG_VDF" | base64 -d > config/config.vdf
          cp config/config.vdf ~/Steam/config/config.vdf
          # (the game, and the demo once its ids are set: upload.mjs writes a script for each that's set up)
          builds=""
          for vdf in "$GITHUB_WORKSPACE"/steam/build-*/app_build.vdf; do [ -e "$vdf" ] && builds="$builds +run_app_build $vdf"; done
          ./steamcmd.sh +login "$STEAM_USERNAME" $builds +quit
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}

  # firestore.rules against the Firestore emulator (test/rules/), which needs Java. Rules are pasted into the Firebase
  # console by hand, so this doesn't gate the deploy, but a pull request that breaks them shows red.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:rules

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
